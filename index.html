<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KeysNepal - Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
    }

    .logo {
      width: 180px; /* increased size */
      margin-bottom: 20px;
      animation: fadeIn 1.5s ease-in-out;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
      color: #38bdf8;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      color: #cbd5f5;
      margin-bottom: 30px;
    }

    .social a {
      text-decoration: none;
      margin: 0 10px;
      font-size: 16px;
      color: white;
      border: 1px solid #38bdf8;
      padding: 10px 20px;
      border-radius: 30px;
      transition: 0.3s;
      display: inline-block;
    }

    .social a:hover {
      background-color: #38bdf8;
      color: #0f172a;
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #94a3b8;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- LOGO -->
    <img src="KeysNepallogo.png" alt="KeysNepal Logo" class="logo">

    <!-- BRAND -->
    <h1>KeysNepal</h1>
    <h2>🚧 Website Under Maintenance</h2>

    <p>
      We're building something amazing for you.<br>
      Stay connected with us on social media!
    </p>

    <!-- SOCIAL LINKS -->
    <div class="social">
      <a href="https://www.facebook.com/keysnepal.np" target="_blank">Facebook</a>
      <a href="https://www.instagram.com/keysnepal.np" target="_blank">Instagram</a>
    </div>

    <!-- FOOTER -->
    <footer>
      © 2026 KeysNepal. All rights reserved.
    </footer>

  </div>
</body>
</html>
